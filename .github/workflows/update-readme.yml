name: Sync README from index.html

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Make script executable
        run: chmod +x scripts/update_readme.sh
      - name: Convert index.html -> README.md
        run: ./scripts/update_readme.sh
      - name: Commit README.md if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync README.md from index.html"
            git push
          fi
